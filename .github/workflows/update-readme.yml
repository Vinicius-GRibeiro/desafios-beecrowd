name: Atualizar contador

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Contar problemas
        run: |
          COUNT=$(find . -type f -name "*.py" -not -path "./.git/*" | wc -l)
          sed -i "s/Problemas resolvidos: [0-9]*/Problemas resolvidos: $COUNT/" README.md

      - name: Atualizar README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo ""
          else
            git commit -m "docs: atualizar contador de problemas"
            git push
          fi